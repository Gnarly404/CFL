<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" style="background: linear-gradient(120deg, #1E3A5F, #56CCF2);">
  <!-- Background Pattern -->
  <rect width="800" height="600" fill="url(#backgroundGradient)"/>

  <!-- Gradient Definition -->
  <defs>
    <linearGradient id="backgroundGradient" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1E3A5F"/>
      <stop offset="100%" stop-color="#56CCF2"/>
    </linearGradient>
  </defs>

  <!-- Books Icon -->
  <g transform="translate(50,400)">
    <rect x="0" y="0" width="100" height="20" rx="5" ry="5" fill="#F4C430"/>
    <rect x="10" y="-25" width="100" height="20" rx="5" ry="5" fill="#FF6F61"/>
    <rect x="20" y="-50" width="100" height="20" rx="5" ry="5" fill="#FFFFFF"/>
  </g>

  <!-- Graduation Cap -->
  <g transform="translate(400,200)">
    <polygon points="50,10 150,50 50,90 -50,50" fill="#FFFFFF"/>
    <rect x="-50" y="50" width="100" height="10" fill="#FF6F61"/>
  </g>

  <!-- Geometric Shapes -->
  <circle cx="700" cy="100" r="50" fill="rgba(255,255,255,0.2)"/>
  <rect x="600" y="400" width="80" height="80" rx="10" ry="10" fill="rgba(255,255,255,0.3)"/>
  <polygon points="300,100 350,150 300,200 250,150" fill="rgba(255,255,255,0.2)"/>
</svg>
