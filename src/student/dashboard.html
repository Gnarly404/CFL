<!DOCTYPE html>
<html lang="en" data-auth="pending" data-veil="on">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dashboard - CFL</title>
<link rel="stylesheet" href="/css/foundation.css">
<link rel="stylesheet" href="/css/fonts.css">
<link rel="stylesheet" href="/css/motion.css">
<link rel="stylesheet" href="/css/tokens.css">
<link rel="stylesheet" href="/css/components.css">
<link rel="stylesheet" href="/css/portal.css">
<link rel="stylesheet" href="/css/practice.css">
<link rel="icon" type="image/png" href="/images/logo.png">
<script type="module" src="/js/pages/student-dashboard.js"></script>
<script type="module" src="/js/motion/boot.js"></script>
</head>
<body class="portal">
<div class="portal-shell">
  <aside class="portal-side" id="portalSide"></aside>

  <main class="portal-main">
    <header class="portal-head" data-reveal="fade">
      <p id="dayMessage" class="muted"></p>
      <h1>Welcome, <span id="studentName">…</span></h1>
      <p class="muted">Reg no: <span id="registrationNumber">…</span> · <span id="profileName">…</span> · <span id="profileStatus">Account active</span></p>
    <button type="button" class="voice-chip voice-chip--quiet" data-voice-line="dash.auto" aria-pressed="false">
        <span class="wave" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></span>
        <span>Hear greeting</span>
      </button>
    </header>

    <div class="stack" data-reveal-group>
      <section class="card continue" aria-labelledby="continueTitle">
        <p class="eyebrow">Continue learning</p>
        <h2 id="continueTitle">Loading…</h2>
        <p id="continueText" class="muted"></p>
        <div id="continueAction"></div>
      </section>

      <section class="card" id="todayCard" aria-label="Today's practice"></section>

      <section class="card" aria-labelledby="practiceTitle">
        <p class="eyebrow">English Practice</p>
        <h2 id="practiceTitle">Six skills, one place</h2>
        <div id="skillGrid" class="skill-grid" data-reveal-group></div>
      </section>

      <div class="two-col">
        <section class="card">
          <h2>Application status</h2>
          <p id="applicationStatus">Loading…</p>
          <div id="studentDetails" class="muted"></div>
        </section>
        <section class="card">
          <h2>Enrolments</h2>
          <ul id="enrolments" class="muted">
            <li>Loading enrolments…</li>
          </ul>
        </section>
      </div>
    </div>
  </main>
</div>
<nav class="portal-bottom" id="portalBottom" aria-label="Student portal mobile"></nav>
</body>
</html>
