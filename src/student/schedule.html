<!DOCTYPE html>
<html lang="en" data-auth="pending" data-veil="on">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Schedule - CFL</title>
<link rel="stylesheet" href="/css/foundation.css">
<link rel="stylesheet" href="/css/fonts.css">
<link rel="stylesheet" href="/css/motion.css">
<link rel="stylesheet" href="/css/tokens.css">
<link rel="stylesheet" href="/css/components.css">
<link rel="stylesheet" href="/css/portal.css">
<link rel="stylesheet" href="/css/practice.css">
<link rel="icon" type="image/png" href="/images/logo.png">
<script type="module" src="/js/pages/student-schedule.js"></script>
<script type="module" src="/js/motion/boot.js"></script>
</head>
<body class="portal">
<div class="portal-shell">
  <aside class="portal-side" id="portalSide"></aside>
  <main class="portal-main">
    <header class="portal-head">
      <h1>Schedule</h1>
      <p id="scheduleSummary" class="muted">Loading…</p>
    </header>
    <p id="scheduleNote" class="form-note" role="alert" hidden></p>
    <section id="nextClass" class="card continue" aria-labelledby="nextTitle" hidden></section>
    <div id="scheduleDays" class="stack"></div>
    <details id="earlierBox" class="card" hidden>
      <summary id="earlierSummary"></summary>
      <div id="earlierDays" class="stack"></div>
    </details>
  </main>
</div>
<nav class="portal-bottom" id="portalBottom" aria-label="Student portal mobile"></nav>
</body>
</html>
