<!DOCTYPE html>
<html lang="en" data-auth="pending" data-veil="on">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Notifications - CFL</title>
<link rel="stylesheet" href="/css/foundation.css">
<link rel="stylesheet" href="/css/fonts.css">
<link rel="stylesheet" href="/css/motion.css">
<link rel="stylesheet" href="/css/tokens.css">
<link rel="stylesheet" href="/css/components.css">
<link rel="stylesheet" href="/css/portal.css">
<link rel="stylesheet" href="/css/practice.css">
<link rel="icon" type="image/png" href="/images/logo.png">
<script type="module" src="/js/pages/student-notifications.js"></script>
<script type="module" src="/js/motion/boot.js"></script>
</head>
<body class="portal">
<div class="portal-shell">
  <aside class="portal-side" id="portalSide"></aside>
  <main class="portal-main">
    <header class="portal-head">
      <h1>Notifications</h1>
      <p id="notifSummary" class="muted">Loading…</p>
    </header>
    <p id="notifNote" class="form-alert" role="status" hidden></p>
    <div class="filter-row" id="notifFilters">
      <button type="button" class="btn" data-filter="all" aria-pressed="true">All</button>
      <button type="button" class="btn" data-filter="unread" aria-pressed="false">Unread</button>
      <button type="button" class="btn" id="markAll">Mark all as read</button>
    </div>
    <ul id="notifList" class="notif-list" aria-live="polite"></ul>
  </main>
</div>
<nav class="portal-bottom" id="portalBottom" aria-label="Student portal mobile"></nav>
</body>
</html>
