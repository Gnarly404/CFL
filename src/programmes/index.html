<!DOCTYPE html>
<html lang="en" data-veil="on">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Programmes - Centre of Foreign Learning</title>
  <link rel="stylesheet" href="/css/foundation.css">
<link rel="stylesheet" href="/css/fonts.css">
<link rel="stylesheet" href="/css/motion.css">
  <link rel="stylesheet" href="/css/programmes.css">
  <link rel="stylesheet" href="/css/site-nav.css">
  <link rel="stylesheet" href="/css/programme-cards.css">
  <script type="module" src="/js/pages/programmes.js"></script>
  <link rel="icon" type="image/png" href="/images/logo.png">
<script type="module" src="/js/motion/boot.js"></script>
</head>
<body>
<!-- @include site-nav -->

<main class="pc-main">
  <header class="pc-head">
    <h1>Our Programmes</h1>
    <p>English language programmes from elementary to advanced.</p>
    <div class="pc-filters" role="group" aria-label="Filter by level">
      <button type="button" class="pc-chip is-active" data-group="all" aria-pressed="true">All</button>
      <button type="button" class="pc-chip" data-group="beginner" aria-pressed="false">Elementary-Beginner</button>
      <button type="button" class="pc-chip" data-group="intermediate" aria-pressed="false">Intermediate</button>
      <button type="button" class="pc-chip" data-group="advanced" aria-pressed="false">Advanced</button>
    </div>
  </header>
  <section id="programmeGrid" class="pc-grid" aria-live="polite" data-reveal-group></section>
</main>

<dialog id="programmeDialog" class="pc-dialog" aria-labelledby="pdTitle">
  <form method="dialog"><button class="pc-close" aria-label="Close">&times;</button></form>
  <p class="pc-kicker" id="pdCategory"></p>
  <h2 id="pdTitle"></h2>
  <dl class="pc-facts" id="pdFacts"></dl>
  <div class="pc-actions"><a class="pc-btn pc-btn-primary" href="/register">Apply now</a></div>
</dialog>

<!-- @include site-footer -->
</body>
</html>
