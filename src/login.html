<!DOCTYPE html>
<html lang="en" data-veil="on">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign in · Centre of Foreign Learning</title>
    <link rel="icon" type="image/png" href="/images/logo.png">
    <link rel="stylesheet" href="/css/foundation.css">
<link rel="stylesheet" href="/css/fonts.css">
<link rel="stylesheet" href="/css/motion.css">
    <link rel="stylesheet" href="/css/login.css">
<script type="module" src="/js/motion/boot.js"></script>
</head>
<body>
    <div class="login-shell">
        <aside class="login-brand" aria-hidden="true">
            <span class="login-brand-word">CFL</span>
            <span class="wave" data-live><i></i><i></i><i></i><i></i><i></i></span>
            <p>Centre of Foreign Learning</p>
            <p class="login-brand-line">Knowledge to empower.</p>
        </aside>
    <main class="login-container">
        <form id="loginForm" class="login-card" novalidate data-reveal>
            <h1>Sign in</h1>
            <p id="loginNotice" class="form-alert" role="status" hidden></p>
            <p id="loginError" class="form-alert" role="alert" hidden></p>
            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" required autocomplete="username" inputmode="email">
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <div class="password-wrapper">
                    <input type="password" id="password" name="password" required autocomplete="current-password">
                    <button type="button" class="password-toggle" aria-label="Show password"><svg class="eye-on" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/></svg><svg class="eye-off" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M3 3l18 18M10.6 5.1A10 10 0 0 1 12 5c6.4 0 10 7 10 7a17 17 0 0 1-3.2 4.2M6.6 6.6A17 17 0 0 0 2 12s3.6 7 10 7c1.7 0 3.2-.4 4.5-1M9.9 9.9a3 3 0 0 0 4.2 4.2"/></svg></button>
                </div>
            </div>
            <div class="remember-me">
                <input type="checkbox" id="rememberMe" name="rememberMe">
                <label for="rememberMe">Keep me signed in on this device</label>
            </div>
            <button type="submit" class="login-button">Sign in</button>
            <div class="login-links">
                <button type="button" id="forgotPasswordLink" class="link-button">Forgot password?</button>
            </div>
            <p class="login-help">
                New here? <a href="/register">Apply to study at CFL</a>.
                Accounts are created once an application is approved. Use the link in your invitation email to choose a password.
            </p>
        </form>
    </main>
    </div>
    <script type="module" src="/js/pages/login.js"></script>
</body>
</html>
