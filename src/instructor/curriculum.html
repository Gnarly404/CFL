<!DOCTYPE html>
<html lang="en" data-auth="pending" data-veil="on">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Practice curriculum - CFL</title>
<link rel="stylesheet" href="/css/foundation.css">
<link rel="stylesheet" href="/css/fonts.css">
<link rel="stylesheet" href="/css/motion.css">
<link rel="stylesheet" href="/css/tokens.css">
<link rel="stylesheet" href="/css/components.css">
<link rel="stylesheet" href="/css/portal.css">
<link rel="stylesheet" href="/css/curriculum.css">
<link rel="icon" type="image/png" href="/images/logo.png">
<script type="module" src="/js/pages/instructor-curriculum.js"></script>
<script type="module" src="/js/motion/boot.js"></script>
</head>
<body class="portal">
<a class="skip-link" href="#studioMain">Skip to the curriculum editor</a>
<div class="portal-shell">
  <aside class="portal-side" id="portalSide"></aside>
  <main class="portal-main" id="studioMain">
    <header class="portal-head">
      <p class="eyebrow">Content studio</p>
      <h1>Practice curriculum</h1>
      <p class="muted">Write and edit the lessons students practise with. Nothing changes for students until you save.</p>
    </header>
    <section class="studio" id="practice-curriculum" aria-labelledby="curriculumHeading">
      <h2 id="curriculumHeading" class="visually-hidden">Lessons by skill</h2>
      <div id="practiceSkillTabs" class="studio-skills" role="tablist" aria-label="Skill" data-glide></div>
      <div class="curriculum-skill-picker">
        <label for="practiceSkill">Skill</label>
        <select id="practiceSkill" class="form-select">
          <option value="grammar">Grammar</option>
          <option value="vocabulary">Vocabulary</option>
          <option value="reading">Reading</option>
          <option value="listening">Listening</option>
          <option value="speaking">Speaking</option>
          <option value="writing">Writing</option>
        </select>
      </div>
      <div class="studio-layout" id="practiceStudioPanel" role="tabpanel">
        <aside class="studio-outline" aria-label="Lessons in selected skill">
          <h3>Lessons</h3>
          <ol id="practiceLessonList" class="curriculum-lesson-list"></ol>
          <button type="button" class="btn btn-outline-secondary btn-block" id="addPracticeLesson">Add lesson</button>
        </aside>
        <form id="practiceContentForm" class="studio-editor" novalidate>
          <div id="practiceLessonFields" class="curriculum-fields" data-reveal-swap></div>
          <div class="studio-bar">
            <p id="practiceContentNote" class="studio-status" role="status" hidden></p>
            <div class="studio-actions">
              <button type="button" class="btn btn-outline-danger" id="deletePracticeLesson">Delete lesson</button>
              <button type="submit" class="btn btn-primary">Save curriculum</button>
            </div>
          </div>
        </form>
      </div>
    </section>
  </main>
</div>
<nav class="portal-bottom" id="portalBottom" aria-label="Instructor mobile"></nav>
</body>
</html>
