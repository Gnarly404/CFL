<!DOCTYPE html>
<html lang="en" data-auth="pending" data-veil="on">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Instructor workspace · Centre of Foreign Learning</title>
    <link rel="icon" type="image/png" href="/images/logo.png">
    <link rel="stylesheet" href="/css/foundation.css">
<link rel="stylesheet" href="/css/fonts.css">
<link rel="stylesheet" href="/css/motion.css">
    <link rel="stylesheet" href="/css/login.css">
<script type="module" src="/js/motion/boot.js"></script>
</head>
<body>
    <main class="login-container">
        <div class="login-card">
            <h1>Welcome, <span id="instructorName">…</span></h1>
            <p id="instructorBio">Loading your profile…</p>

            <section class="card mt-4">
                <h2>Assigned courses</h2>
                <ul id="assignedCourses"><li>Loading courses…</li></ul>
            </section>

            <section class="card mt-4">
                <h2>Assigned students</h2>
                <ul id="assignedStudents"><li>Loading students…</li></ul>
            </section>

            <p><a href="/login" class="login-button" data-action="sign-out">Sign out</a></p>
        </div>
    </main>
    <script type="module" src="/js/pages/instructor-dashboard.js"></script>
</body>
</html>
